<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainMapper — Analyze</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/dashboard.css">
</head>
<body>
  <main class="dashboard-card">
    <a href="/class_dashboard.html?classId=class-1" class="back-pill" id="back-link">
      <img src="/assets/icons/arrow-left-sm.svg" alt="" width="11" height="11">
      <span>Back to Class</span>
    </a>

    <header class="dash-header" style="margin-top: 24px;">
      <a href="/" class="bm-wordmark" style="margin: 0 auto 2px;">BrainMapper</a>
      <h1 class="dash-title" style="font-size: 38px;">Analyze</h1>
      <p style="margin-top: 6px; padding: 6px 16px; border-radius: 9999px; background: var(--amber-100); color: var(--amber-700); font-size: 13px; font-weight: 700;">
        Work in progress
      </p>
    </header>

    <a href="/class_dashboard.html?classId=class-1" class="dash-btn dash-btn--amber" id="dash-link">
      <span>Return to Class Dashboard</span>
    </a>
  </main>

  <script>
    const classId = encodeURIComponent(new URLSearchParams(window.location.search).get('classId') || 'class-1');
    document.getElementById('back-link').href = `/class_dashboard.html?classId=${classId}`;
    document.getElementById('dash-link').href = `/class_dashboard.html?classId=${classId}`;
  </script>
</body>
</html>
