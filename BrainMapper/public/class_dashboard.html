<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainMapper — Class Dashboard</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/dashboard.css">
</head>
<body>
  <main class="dashboard-card">
    <div class="ambient-glow" aria-hidden="true"></div>

    <a href="/" class="back-pill">
      <img src="/assets/icons/arrow-left-sm.svg" alt="" width="11" height="11">
      <span>All Classes</span>
    </a>

    <header class="dash-header">
      <h1 class="dash-title">BrainMapper</h1>
      <p class="dash-subtitle">Class dashboard</p>
      <div class="dash-class-pill-row">
        <span class="dash-class-pill" id="active-class-pill">Class 1</span>
        <a href="/?roster=class-1" class="dash-roster-link" id="roster-quick-link">Roster (32)</a>
      </div>
    </header>

    <nav class="dash-menu" aria-label="Class operations">
      <a href="/quiz_library.html?classId=class-1" class="dash-btn dash-btn--blue" id="btn-library">
        <img src="/assets/icons/dash-library.svg" alt="" width="20" height="15">
        <span>Quiz Library</span>
      </a>

      <a href="/create_quiz.html?classId=class-1" class="dash-btn dash-btn--indigo" id="btn-create">
        <img src="/assets/icons/dash-create.svg" alt="" width="18" height="18">
        <span>Create Quizzes</span>
      </a>

      <a href="/session_monitor.html?classId=class-1" class="dash-btn dash-btn--emerald" id="btn-session">
        <img src="/assets/icons/dash-play.svg" alt="" width="11" height="13">
        <span>Start Session</span>
      </a>

      <a href="/analyze.html?classId=class-1" class="dash-btn dash-btn--amber" id="btn-analyze">
        <img src="/assets/icons/dash-analyze.svg" alt="" width="15" height="15">
        <span>Analyze</span>
      </a>
    </nav>
  </main>

  <script src="/js/class_dashboard.js"></script>
</body>
</html>
