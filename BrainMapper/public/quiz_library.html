<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainMapper — Quiz Library</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/library.css">
</head>
<body>
  <main class="library-shell">
    <header class="lib-header">
      <div class="lib-header-left">
        <a href="/class_dashboard.html?classId=class-1" class="back-btn" id="back-link">
          <img src="/assets/icons/back-arrow.svg" alt="" width="16" height="16">
          <span>Back</span>
        </a>
        <div class="lib-title-group">
          <div class="bm-title-stack">
            <a href="/" class="bm-wordmark">BrainMapper</a>
            <h1 class="lib-title">Quiz Library</h1>
          </div>
          <span class="class-context-pill" id="class-pill">Class 1</span>
        </div>
      </div>

      <div class="lib-header-actions">
        <a href="/create_quiz.html?classId=class-1" class="cta-btn cta-btn--emerald" id="create-quiz-link">
          <img src="/assets/icons/lib-plus-white.svg" alt="" width="16" height="16">
          <span>Create New Quiz</span>
        </a>
      </div>
    </header>

    <nav class="lib-tabs" aria-label="Library sections">
      <button type="button" class="lib-tab is-active" data-tab="quizzes">
        <img src="/assets/icons/tab-all.svg" alt="" width="16" height="16">
        <span>All Quizzes</span>
      </button>
      <button type="button" class="lib-tab" data-tab="templates">
        <img src="/assets/icons/tab-templates.svg" alt="" width="16" height="16">
        <span>Templates</span>
      </button>
      <button type="button" class="lib-tab" data-tab="archived">
        <img src="/assets/icons/tab-archived.svg" alt="" width="16" height="16">
        <span>Archived</span>
      </button>
    </nav>

    <section class="lib-filters" aria-label="Filter quizzes">
      <div class="search-wrap">
        <img src="/assets/icons/lib-search.svg" alt="" width="16" height="16">
        <input type="search" id="search-input" class="filter-input" placeholder="Search quizzes..." aria-label="Search quizzes">
      </div>

      <div class="select-wrap">
        <select id="category-filter" class="filter-select" aria-label="Filter by category">
          <option value="">All Categories</option>
          <option value="Mathematics">Mathematics</option>
          <option value="Science">Science</option>
          <option value="History">History</option>
          <option value="English">English</option>
          <option value="Other">Other</option>
        </select>
        <img src="/assets/icons/chevron-down.svg" alt="" width="16" height="16" class="select-chevron">
      </div>

      <div class="select-wrap">
        <select id="difficulty-filter" class="filter-select" aria-label="Filter by difficulty">
          <option value="">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
        <img src="/assets/icons/chevron-down.svg" alt="" width="16" height="16" class="select-chevron">
      </div>

      <button type="button" class="cta-btn cta-btn--indigo" id="open-import-btn">
        <img src="/assets/icons/csv-upload.svg" alt="" width="16" height="16">
        <span>Import CSV</span>
      </button>
    </section>

    <section id="library-content" aria-live="polite"></section>
  </main>

  <!-- Import CSV Modal -->
  <div class="modal-backdrop" id="import-modal" hidden>
    <div class="modal-card modal-card--sm" role="dialog" aria-modal="true" aria-labelledby="import-modal-title">
      <div class="modal-head">
        <h2 id="import-modal-title">Import Questions from CSV</h2>
        <button type="button" class="modal-close" id="import-close-x" aria-label="Close import modal">
          <img src="/assets/icons/close.svg" alt="" width="20" height="20">
        </button>
      </div>
      <label style="font-size: 13px; font-weight: 600;">Quiz Name</label>
      <input type="text" id="import-quiz-name" class="filter-input" style="padding-left: 16px;" placeholder="e.g., Imported Algebra Quiz">
      <label style="font-size: 13px; font-weight: 600;">CSV File</label>
      <input type="file" id="csv-file-input" accept=".csv">
      <p class="csv-hint">
        MCQ only: <code>question,multiple-choice,optionA,optionB,optionC,optionD,correct(A-D),explanation</code>
      </p>
      <div class="modal-foot">
        <button type="button" class="btn-flat btn-flat--muted" id="import-cancel-btn">Cancel</button>
        <button type="button" class="btn-flat btn-flat--primary" id="import-submit-btn">Import Quiz</button>
      </div>
    </div>
  </div>

  <script src="/js/quiz_library.js"></script>
</body>
</html>
